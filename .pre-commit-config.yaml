repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Local mypy gate: catches missing type annotations on public functions
  # (enforced by --strict) before push, mirroring CI. Run via uv to use the
  # locked environment rather than an isolated pre-commit venv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/pycatdap/
        language: system
        types: [python]
        pass_filenames: false

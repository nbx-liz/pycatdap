name: Benchmarks

# NON-BLOCKING performance benchmarks (Issue #161; Phase 2 H-0022 + Phase 3 H-0023
# of #29). GitHub-hosted runners share CPU and are noisy, so this NEVER blocks a
# PR or commit (fail-on-alert: false). Regressions / deltas surface as comments.
#
# Two modes:
#   - schedule / workflow_dispatch: run the FULL suite, append history to the
#     gh-pages BRANCH (dev/bench/), and comment on regressions only.
#   - pull_request (touching src or the benchmark plumbing): run the non-slow
#     subset, compare against the gh-pages baseline WITHOUT writing history, and
#     leave a delta commit comment on the PR head commit (same-repo PRs only;
#     fork PRs get a read-only validate run with no comment).
#
# Trend history + dashboard live in the `gh-pages` BRANCH only. The repo's public
# Pages site is served from the GitHub Actions artifact (mkdocs, docs.yml:
# build_type=workflow), so gh-pages is data-only and the chart is not web-served.
# The gh-pages branch is PRE-CREATED (orphan) — github-action-benchmark errors on
# a missing branch when fetching.
#
# NOTE: scheduled workflows fire from the DEFAULT branch (main), so the nightly
# cadence activates once this file reaches main (next release). Until then, use
# workflow_dispatch on develop.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pycatdap/**" # measure the perf impact of code changes
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "Makefile"
      - "pyproject.toml"

permissions:
  contents: write # gh-pages push + commit comment (schedule/dispatch)
  pull-requests: write # PR-delta comment (the action posts a PR review comment on
    # pull_request events; fork PRs get a read-only token regardless and are
    # additionally guarded out of commenting via comment-always's same-repo check).

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs full history for the version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        # bench group only (pytest + pytest-benchmark). NO extras: the benchmarks
        # use synthetic data and never fetch from OpenML, so scikit-learn is not
        # needed and is intentionally excluded to avoid the D4 fetcher network
        # hang observed when sklearn is present.
        run: uv sync --frozen --group bench

      - name: Run benchmarks
        # PRs run the non-slow subset to bound feedback time; scheduled/dispatch
        # runs measure the full suite (incl. the slow slice-discovery benchmark).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make bench BENCH_ARGS="--benchmark-json=output.json -m 'not slow'"
          else
            make bench BENCH_ARGS="--benchmark-json=output.json"
          fi

      - name: Store result / post delta comment (non-blocking)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pycatdap benchmarks
          tool: pytest
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # +50% slower triggers an alert. Deliberately above the +20% notion
          # because hosted-runner timing is noisy; tune after observing trends.
          alert-threshold: "150%"
          # Non-PR: append history to gh-pages and comment only on regression.
          # PR: compare against the gh-pages baseline WITHOUT writing history.
          auto-push: ${{ github.event_name != 'pull_request' }}
          save-data-file: ${{ github.event_name != 'pull_request' }}
          comment-on-alert: ${{ github.event_name != 'pull_request' }}
          # PR-delta comment: a commit comment on the PR head with the full
          # comparison table. Restricted to same-repo PRs — fork PRs get a
          # read-only GITHUB_TOKEN and cannot comment, so they just validate.
          comment-always: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-alert: false # NEVER block — comment only

      - name: Upload raw benchmark JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-output
          path: output.json
          if-no-files-found: warn

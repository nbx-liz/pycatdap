name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Intentionally NOT --extra all: that would pull scikit-learn (added
        # in v0.8.0 [data] extras and rolled into [all]) into the Quality
        # matrix. The D4 fetchers use ``pytest.importorskip("sklearn")`` to
        # skip their network-bound smoke tests; with sklearn installed those
        # tests would proceed to OpenML and hang on GitHub runners (~6h
        # timeout observed on PR #106). The release-PR pytest path runs
        # ``-m ""`` which would otherwise execute the slow + network tests.
        run: uv sync --frozen --dev --extra plot --extra plotly

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src/pycatdap/

      - name: Test (pytest)
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            uv run pytest tests/ -m "" --cov=pycatdap --cov-report=term-missing --cov-fail-under=80 -q
          else
            uv run pytest tests/ -m "not slow" --cov=pycatdap --cov-report=term-missing --cov-fail-under=80 -q
          fi

  quality-lowest-deps:
    name: Quality (lowest-direct deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install lowest direct dependencies
        run: uv sync --frozen --dev --resolution lowest-direct

      - name: Test (pytest)
        run: uv run pytest tests/ -q

  distribution:
    name: Distribution check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: uv sync --frozen --dev

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution
        run: uv run twine check dist/*

      - name: Smoke test installation from wheel
        run: |
          pip install dist/*.whl --quiet
          python -c "from pycatdap import __version__; print('import ok:', __version__)"

  notebooks:
    name: Tutorial notebooks (nbmake)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install notebook deps
        run: uv sync --frozen --group notebooks --extra all --extra tutorial

      - name: Execute tutorial notebooks
        run: uv run pytest --nbmake docs/tutorials/ --no-cov -q

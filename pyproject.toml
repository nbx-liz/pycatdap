[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycatdap"
version = "0.1.0"
description = "Python implementation of CATDAP (CATegorical Data Analysis Program)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "nbx-liz" },
]
keywords = ["statistics", "categorical-data", "AIC", "CATDAP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
all = [
    "pycatdap[plot,dev]",
]

[project.urls]
Repository = "https://github.com/nbx-liz/pycatdap"

[tool.hatch.build.targets.wheel]
packages = ["src/pycatdap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src/pycatdap --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

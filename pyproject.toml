[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pycatdap"
dynamic = ["version"]
description = "Python implementation of CATDAP (CATegorical Data Analysis Program)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "nbx" },
]
keywords = ["statistics", "categorical-data", "AIC", "CATDAP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
    "statsmodels>=0.14",
]
plotly = [
    "plotly>=5.20",
    "jinja2>=3.1",
]
all = [
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "plotly>=5.20",
    "jinja2>=3.1",
    "scikit-learn>=1.3",
]
tutorial = [
    "seaborn>=0.13",
]
data = [
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "twine>=5.0",
    "build",
    "pandas-stubs",
    "vulture",
    "pre-commit>=4.0",
    "matplotlib>=3.7",
]
notebooks = [
    "nbmake>=1.5",
    "seaborn>=0.13",
    "plotly>=5.20",
    "matplotlib>=3.7",
    "ipykernel>=6.29",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/nbx-liz/pycatdap"
Repository = "https://github.com/nbx-liz/pycatdap"
Issues = "https://github.com/nbx-liz/pycatdap/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/pycatdap/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycatdap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=pycatdap --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional dependencies — type stubs not always installed
[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "statsmodels.*",
    "IPython.*",
]
ignore_missing_imports = true
